<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Tracker</title>
    <meta name="description" content="Track the books you want to read, are reading, or have finished." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="container">
      <h1>Book Tracker</h1>

      <!-- Add-book form -->
      <form id="book-form" novalidate>

        <div class="field">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" placeholder="Book title" />
          <!-- Inline validation message for title -->
          <span class="field-error" id="title-error"></span>
        </div>

        <div class="field">
          <label for="author-input">Author</label>
          <input type="text" id="author-input" placeholder="Author name" />
          <!-- Inline validation message for author -->
          <span class="field-error" id="author-error"></span>
        </div>

        <div class="field">
          <label for="status-select">Status</label>
          <select id="status-select">
            <option value="to-read">To read</option>
            <option value="reading">Reading</option>
            <option value="finished">Finished</option>
          </select>
        </div>

        <button type="submit" id="add-btn">Add Book</button>

      </form>

      <!-- Shown only when localStorage.setItem fails -->
      <p id="save-error" class="save-error"></p>

      <!-- Search box — filters the displayed list without touching the data -->
      <div class="search-wrapper">
        <label for="search-input" class="search-label">Search</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search by title or author…"
          autocomplete="off"
        />
      </div>

      <!-- Book list rendered by render() -->
      <ul id="book-list"></ul>

    </div>

    <script src="app.js"></script>
  </body>
</html>
